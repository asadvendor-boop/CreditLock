[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creditlock"
version = "0.1.0"
description = "Production credit-obligation control plane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "google-genai>=2.14.0,<3",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.19.0",
    "confluent-kafka>=2.8.0",
    "jsonschema>=4.23.0",
    "PyJWT>=2.9.0",
    "cryptography>=42.0.0,<49.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "anyio>=4.7.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/creditlock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_chrome: integration tests that launch real Chromium (requires CREDITLOCK_RUN_REAL_CHROME=1)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
